<div class="modal-overlay">
  <div class="modal-content">
    <h3>Create New Item</h3>
    <form (ngSubmit)="onSubmit()">
      <label>Name *</label>
      <input [(ngModel)]="item.name" name="name" required />

      <label>Description</label>
      <textarea [(ngModel)]="item.description" name="description"></textarea>

      <label>Created At</label>
      <input type="date" [(ngModel)]="item.createdat" name="createdat" />

      <label>Size (KB) *</label>
      <input [(ngModel)]="item.sizekb" name="sizekb" required />

      <label>Tags *</label>
      <input [(ngModel)]="item.tags" name="tags" required />

      <label>Visibility *</label>
      <select [(ngModel)]="item.visibility" name="visibility" required>
        <option value="">-- Select --</option>
        <option value="public">Public</option>
        <option value="private">Private</option>
        <option value="restricted">Restricted</option>
      </select>

      <div class="actions">
        <button type="submit" class="safe button">Submit</button>
        <button type="button" class="button danger" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
