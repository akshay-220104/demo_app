<div class="form-container" *ngIf="showForm">
      <h3>Add New Item</h3>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" [(ngModel)]="item.name" name="name" required>
        </div>
        <div class="form-group">
          <label for="description">Description:</label>
          <textarea id="description" [(ngModel)]="item.description" name="description" required></textarea>
        </div>
        <div class="form-group">
          <label for="createdAt">Created At:</label>
          <input type="datetime-local" id="createdAt" [(ngModel)]="item.createdat" name="createdAt" required>
        </div>
        <div class="button-group">
          <button type="submit">Submit</button>
          <button type="button" (click)="cancelForm()">Cancel</button>
        </div>
      </form>
    </div>
