<div class="container">
  <h2>Items List</h2>
  <button type="button" (click)="loadItems()">Load Items</button>

  <div class="results" *ngIf="items$ | async as response; else noData">
    <p *ngIf="response.items.length === 0">No items found.</p>
    
    <div *ngIf="response.items.length > 0">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of response.items">
            <td>{{item.id}}</td>
            <td>{{item.name}}</td>
            <td>{{item.description}}</td>
          </tr>
        </tbody>
      </table>

      <div class="pagination">
        <button [disabled]="currentPage === 1" (click)="previousPage()">
          Previous
        </button>
        <span>
          Page {{currentPage}} of {{getTotalPages(response.total)}}
        </span>
        <button [disabled]="currentPage >= getTotalPages(response.total)" 
                (click)="nextPage()">
          Next
        </button>
      </div>
    </div>
  </div>

  <ng-template #noData>
    <p>No data loaded. Click <em>Load Items</em> to start.</p>
  </ng-template>
</div>
